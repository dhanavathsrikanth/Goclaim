name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "dodo-nextjs/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dodo-nextjs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dodo-nextjs/package-lock.json

      - run: npm ci

      - name: Verify Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://goclaim.space

      - name: Build + deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: https://goclaim.space
